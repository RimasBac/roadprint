name: RoadPrint
options:
  bundleIdPrefix: com.rimasbac
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RoadPrintCore:
    path: RoadPrintCore
targets:
  RoadPrint:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources/Fonts]
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: RoadPrintCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RoadPrint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Fonts/Inter/Inter-400.ttf
          - Fonts/Inter/Inter-500.ttf
          - Fonts/Inter/Inter-600.ttf
          - Fonts/Inter/Inter-700.ttf
          - Fonts/BarlowCondensed/BarlowCondensed-600.ttf
          - Fonts/BarlowCondensed/BarlowCondensed-700.ttf
        UIBackgroundModes: [location]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: RoadPrint records your route only between Start Trip and End Trip.
        NSMotionUsageDescription: RoadPrint uses the barometer to smooth altitude for your trip's elevation profile while a trip is recording.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rimasbac.roadprint
        # XcodeGen's iOS app preset sets "1,2" on the target, overriding the project value.
        # iPhone only (plan v1); a universal app needs all 4 orientations or ASC rejects it (90474).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Bundle replay GPX (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            for f in i80-ui-test.gpx i80-slc-sac.gpx i80-slc-sac-route.json; do
              cp "$SRCROOT/RoadPrintCore/Tests/RoadPrintCoreTests/Fixtures/$f" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
            done
          fi
  RoadPrintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoadPrintTests
      - path: RoadPrintCore/Tests/RoadPrintCoreTests/Fixtures/projection-golden.json
        buildPhase: resources
    dependencies:
      - target: RoadPrint
      - package: RoadPrintCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rimasbac.roadprint.tests
        GENERATE_INFOPLIST_FILE: YES
  RoadPrintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RoadPrintUITests]
    dependencies:
      - target: RoadPrint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rimasbac.roadprint.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RoadPrint:
    build:
      targets:
        RoadPrint: all
    test:
      targets: [RoadPrintTests, RoadPrintUITests]
    run:
      config: Debug
