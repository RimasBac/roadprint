name: ios-build
run-name: ios-${{ inputs.evidence || (github.event_name == 'pull_request' && 'quick' || 'regression') }} ${{ github.ref_name }}
on:
  pull_request:
    branches: [main]
    paths: ['App/**', 'RoadPrintCore/**', 'RoadPrintTests/**', 'RoadPrintUITests/**', 'project.yml', 'Design/tokens.json', 'Tools/ci/**', '.github/workflows/ios-build.yml']
  push:
    branches: [main]
    paths: ['App/**', 'RoadPrintCore/**', 'RoadPrintTests/**', 'RoadPrintUITests/**', 'project.yml', 'Design/tokens.json', 'Tools/ci/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      evidence:
        description: 'quick: unit + smoke; targeted: one class/test; regression/tests: functional suite; routine: screenshots; full: device matrix; appstore: 6.9-inch launch screenshots; apppreview: 6.9-inch App Store preview video'
        type: choice
        default: quick
        options: [quick, targeted, regression, tests, routine, full, appstore, apppreview]
      test_filter:
        description: 'For targeted only: Target/Class[/test]'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}-${{ inputs.evidence || github.event_name }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'integration/')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Reuse full integration proof for the exact promoted commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = push ] && gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/ios-build.yml" and .event == "workflow_dispatch" and .conclusion == "success" and (.display_title | startswith("ios-regression "))) | .id' | grep -q .; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Exact commit already passed full integration regression.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
  ios-build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      EVIDENCE: ${{ inputs.evidence || (github.event_name == 'pull_request' && 'quick' || 'regression') }}
      TEST_FILTER: ${{ inputs.test_filter }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 27.x
        run: bash Tools/ci/select-xcode-27.sh
      - name: Generate project and simulator
        run: |
          brew install xcodegen
          xcodegen generate
          python3 Tools/ci/create-evidence-simulators.py
      - name: Boot simulator while compiling
        run: xcrun simctl boot "$SIM_UDID"
      - name: Set the App Store status bar
        if: inputs.evidence == 'appstore' || inputs.evidence == 'apppreview'
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl ui "$SIM_UDID" appearance dark
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
      - name: Build once and run selected checks
        run: bash Tools/ci/ios-test.sh "$EVIDENCE"
      - name: Timing summary
        if: always()
        run: |
          grep -E '^Test Case .*(passed|failed) \(' build/xcodebuild.log \
            | sed -E 's/.*-\[([^]]+)\]. (passed|failed) \(([0-9.]+) seconds\).*/\3s \2 \1/' \
            | sort -rn | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Full device matrix using the existing build
        if: inputs.evidence == 'full'
        run: |
          set -o pipefail
          xcrun simctl shutdown "$SIM_UDID"
          for entry in "SE:$SIM_SE_UDID" "ProMax:$SIM_MAX_UDID"; do
            NAME=${entry%%:*}; UDID=${entry#*:}
            xcodebuild test-without-building -project RoadPrint.xcodeproj -scheme RoadPrint \
              -destination "id=$UDID" -parallel-testing-enabled NO \
              -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
              -resultBundlePath "build/$NAME.xcresult" \
              -only-testing:RoadPrintUITests/TokensGalleryScreenshotTests/testHomeEvidenceMatrix \
              -only-testing:RoadPrintUITests/TokensGalleryScreenshotTests/testHomeStorageStates \
              -only-testing:RoadPrintUITests/DriveStateTests \
              -only-testing:RoadPrintUITests/TripSummaryEvidenceTests/testI80SummaryDayAX3 \
              CODE_SIGNING_ALLOWED=NO | tail -n 80
            xcrun simctl shutdown "$UDID" || true
          done
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          cp build/device-evidence.json build/screenshots/ || true
          for result in build/*.xcresult; do
            test -d "$result" || continue
            xcrun xcresulttool export attachments --path "$result" --output-path "build/screenshots/$(basename "$result" .xcresult)" || true
          done
      - name: Validate the five App Store PNGs
        if: inputs.evidence == 'appstore'
        run: python3 Tools/ci/collect-appstore-screenshots.py build/screenshots/RoadPrint build/appstore-screenshots
      - name: Cut the App Store preview and keep the card video
        if: inputs.evidence == 'apppreview'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          mkdir -p build/app-preview
          python3 Tools/ci/make-app-preview.py build/preview-raw.mov build/record-stop.txt build/xcodebuild.log \
            build/app-preview/roadprint-app-preview-6.9in-886x1920.mp4
          data=$(xcrun simctl get_app_container "$SIM_UDID" com.rimasbac.roadprint data)
          find "$data/tmp" -name 'RoadPrint-trip-*.mp4' -exec cp {} build/app-preview/ \;
          cp build/preview-raw.mov build/app-preview/screen-recording-raw.mov
          ls -la build/app-preview | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.evidence == 'apppreview'
        with:
          name: app-preview
          path: build/app-preview/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.evidence == 'appstore'
        with:
          name: appstore-screenshots
          path: build/appstore-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ env.EVIDENCE }}-evidence
          path: |
            build/screenshots
            build/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult
          path: build/*.xcresult
          retention-days: 3
