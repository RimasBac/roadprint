name: ios-build

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'RoadPrintCore/**'
      - 'RoadPrintTests/**'
      - 'RoadPrintUITests/**'
      - 'project.yml'
      - 'Design/tokens.json'
      - 'Tools/ci/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      evidence:
        description: "tests: build + tests, no screenshot suite. routine: + screenshot suite on iPhone 16. full: + SE and Pro Max, at most once per finished screen"
        type: choice
        default: tests
        options: [tests, routine, full]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: ios-build
    runs-on: macos-26
    timeout-minutes: 24
    env:
      # Pushes to main only prove the app builds and the tests pass. The
      # screenshot suite (TokensGalleryScreenshotTests, about 4 min) runs only
      # when someone dispatches routine or full evidence for a visual review.
      EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence || 'tests' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26.x
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -E 'Xcode_26(\.[0-9]+)*\.app$' | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Create evidence simulators
        run: python3 Tools/ci/create-evidence-simulators.py
      - name: Boot simulator while the app compiles
        run: xcrun simctl boot "$SIM_UDID"
      - name: Build and test
        run: |
          set -o pipefail
          SKIP=()
          if [ "$EVIDENCE" = tests ]; then
            SKIP=(-skip-testing:RoadPrintUITests/TokensGalleryScreenshotTests)
          fi
          xcodebuild test -project RoadPrint.xcodeproj -scheme RoadPrint \
            -destination "id=$SIM_UDID" -parallel-testing-enabled NO \
            -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath build/RoadPrint.xcresult "${SKIP[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | tail -n 80
      - name: Timing summary
        if: always()
        run: |
          grep -E "^Test Case .*(passed|failed) \(" build/xcodebuild.log \
            | sed -E 's/.*-\[([^]]+)\]. (passed|failed) \(([0-9.]+) seconds\).*/\3s \2 \1/' \
            | sort -rn || true
      - name: Home evidence on SE and Pro Max (reuse build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence == 'full' }}
        run: |
          set -o pipefail
          xcrun simctl shutdown "$SIM_UDID" || true
          for entry in "SE:$SIM_SE_UDID" "ProMax:$SIM_MAX_UDID"; do
            NAME=${entry%%:*}
            UDID=${entry#*:}
            xcodebuild test-without-building -project RoadPrint.xcodeproj -scheme RoadPrint \
              -destination "id=$UDID" -parallel-testing-enabled NO \
              -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages \
              -resultBundlePath "build/$NAME.xcresult" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              -only-testing:RoadPrintUITests/TokensGalleryScreenshotTests/testHomeEvidenceMatrix \
              -only-testing:RoadPrintUITests/TokensGalleryScreenshotTests/testHomeStorageStates \
              -only-testing:RoadPrintUITests/DriveStateTests \
              CODE_SIGNING_ALLOWED=NO | tail -n 80
            xcrun simctl shutdown "$UDID" || true
          done
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          cp build/device-evidence.json build/screenshots/ || true
          for result in build/*.xcresult; do
            NAME=$(basename "$result" .xcresult)
            xcrun xcresulttool export attachments --path "$result" --output-path "build/screenshots/$NAME" || true
          done
          find build/screenshots -type f | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult
          path: build/*.xcresult
