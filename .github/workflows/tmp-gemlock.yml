name: tmp-gemlock
on: push
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: |
          bundle lock --add-platform arm64-darwin x86_64-darwin x86_64-linux
          bundle lock
          cat Gemfile.lock | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: gemlock
          path: Gemfile.lock
