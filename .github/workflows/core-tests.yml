name: core-tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    # The one place the Swift image is pinned. Keep in sync with docs/adr/0002.
    container: swift:6.2-noble
    defaults:
      run:
        working-directory: RoadPrintCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check design tokens and app literals
        working-directory: .
        run: |
          node Tools/design/gen-tokens.mjs
          node Tools/design/gen-road-signs.mjs
          # The Swift container runs as root; checkout is owned by the runner.
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- App/Design/Tokens.generated.swift App/Design/RoadSigns.generated.swift App/Assets.xcassets
          git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain -- App/Assets.xcassets | (! grep .)
          node --test Tools/design/gen-tokens.test.mjs
          node Tools/design/check-app-literals.mjs
          node Tools/design/check-fonts.mjs
      - name: Check privacy usage descriptions
        working-directory: .
        run: |
          node --test Tools/ci/check-privacy-keys.test.mjs
          node Tools/ci/check-privacy-keys.mjs
      - id: swiftver
        run: echo "v=$(swift --version | head -1 | tr -c '[:alnum:].\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: RoadPrintCore/.build
          key: spm-${{ steps.swiftver.outputs.v }}-${{ hashFiles('RoadPrintCore/Package.swift', 'RoadPrintCore/Package.resolved') }}
      - run: swift build
      - run: swift test
        env:
          MAP_SCENE_OUTPUT_DIR: ${{ github.workspace }}/build/map-scene
      - name: MapScene benchmark (release, loaded PlaceIndex)
        if: always()
        run: swift test -c release --filter MapSceneTests/testReleaseBuildPerformance
      - name: Render MapScene previews at 2x
        if: always()
        working-directory: .
        run: |
          npm ci --prefix Tools/design
          node Tools/design/fetch-fonts.mjs
          node --test Tools/design/scene-preview.test.mjs
          for scene in build/map-scene/*.json; do
            test -f "$scene" || continue
            node Tools/design/scene-preview.mjs "$scene" build/map-scene night
            node Tools/design/scene-preview.mjs "$scene" build/map-scene day
          done
          if test -f build/map-scene/i80-390x460-night@2x.png; then
            node Tools/design/scene-comparison.mjs build/map-scene/i80-390x460-night@2x.png build/map-scene/i80-vs-mockup@2x.png
          fi
      - name: Upload MapScene geometry and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-scene-previews
          path: build/map-scene/
          if-no-files-found: warn
      - name: Projection benchmark (release, 100k points per projection)
        run: swift test -c release --filter MapProjectionTests/testReleaseProjectionPerformance
