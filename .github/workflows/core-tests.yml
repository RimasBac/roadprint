name: core-tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'integration/')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: swift:6.2.4-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install coordinator test runtime
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Static checks and coordinator tests
        run: bash Tools/ci/check.sh --static
      - name: Select core checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'core=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Eq '^(RoadPrintCore/|\.github/workflows/core-tests.yml|Tools/ci/|Tools/automation/)'; then
            echo 'core=true' >> "$GITHUB_OUTPUT"
          else
            echo 'core=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.scope.outputs.core == 'true'
        with:
          path: RoadPrintCore/.build
          key: core-linux-6.2.4-${{ hashFiles('RoadPrintCore/**') }}
          restore-keys: core-linux-6.2.4-
      - name: Core tests
        if: steps.scope.outputs.core == 'true'
        run: bash Tools/ci/check.sh --core
