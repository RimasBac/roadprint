<?xml version="1.0" encoding="UTF-8"?>
<!-- RoadPrint Terrain share card, hide-route template (terrain-style-2).
     1080×1920 export pixels. Every value mirrors Design/tokens.json → terrain.*; tokens win on conflict.
     Text elements are placeholders the app fills ({…}); they stay live text on purpose.
     Places and permitted stats only. Add a third chip for the high point value if wanted; never its location. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" id="terrain-card">
  <title>Terrain share card template, hide route</title>
  <defs>
    <linearGradient id="fade-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14161c"/><stop offset="1" stop-color="#14161c" stop-opacity="0"/></linearGradient>
    <linearGradient id="fade-bottom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14161c" stop-opacity="0"/><stop offset="1" stop-color="#14161c"/></linearGradient>
  </defs>

  <rect id="background" width="1080" height="1920" fill="#14161c"/>

  <!-- Hide route: fixed generic backdrop, identical for every trip. No relief, route, summit or profile. -->
  <svg x="0" y="380" width="1080" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" id="generic-backdrop">
<title>Terrain card generic backdrop (hide-route). Identical for every trip; encodes no route or place.</title>
