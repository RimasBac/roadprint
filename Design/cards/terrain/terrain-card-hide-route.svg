<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"><title>RoadPrint Terrain card, style 5, hide route: layer order and slots. Text is placeholder text the app fills</title><rect id="background" width="1080" height="1920" fill="#14161c"/>
<defs><filter id="txt-shade" color-interpolation-filters="sRGB" x="-20%" y="-40%" width="140%" height="180%"><feColorMatrix in="SourceAlpha" type="matrix" values="0 0 0 0 0.043  0 0 0 0 0.047  0 0 0 0 0.063  0 0 0 1 0" result="a"/><feMorphology in="a" operator="dilate" radius="3" result="ad"/><feGaussianBlur in="ad" stdDeviation="6" result="b"/><feComponentTransfer in="b" result="o"><feFuncA type="linear" slope="0.75"/></feComponentTransfer><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect id="relief-slot" width="1080" height="1920" fill="#2a2d36"><title>Relief: the app paints the core's draw list here, full bleed</title></rect>
<defs><linearGradient id="scrim-top-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14161c" stop-opacity="0.6"/><stop offset="1" stop-color="#14161c" stop-opacity="0"/></linearGradient><linearGradient id="scrim-bottom-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14161c" stop-opacity="0"/><stop offset="1" stop-color="#14161c" stop-opacity="0.85"/></linearGradient></defs><rect id="scrim-top" width="1080" height="620" fill="url(#scrim-top-fill)"/><rect id="scrim-bottom" y="1120" width="1080" height="800" fill="url(#scrim-bottom-fill)"/>
<g id="places" filter="url(#txt-shade)"><g id="place-1"><text x="752.5" y="807.5" font-family="Inter" font-weight="600" font-size="30" letter-spacing="0" fill="#f0efec" id="place-1-name">Salt Lake City</text><circle cx="850.5" cy="832.5" r="13" fill="#14161c"/><circle cx="850.5" cy="832.5" r="9" fill="#f0efec"/></g><g id="place-2"><text x="125.0" y="926.3" font-family="Inter" font-weight="600" font-size="30" letter-spacing="0" fill="#f0efec" id="place-2-name">Sacramento</text><circle cx="211.1" cy="951.3" r="13" fill="#14161c"/><circle cx="211.1" cy="951.3" r="9" fill="#f0efec"/></g></g>

<g id="type" filter="url(#txt-shade)"><text x="72" y="272" font-family="Inter" font-weight="600" font-size="28" letter-spacing="4" fill="#a6aab4" id="kicker-date">WEDNESDAY, NOVEMBER 4, 2026</text><text x="72" y="362" font-family="Barlow Condensed" font-stretch="condensed" font-weight="700" font-size="92" letter-spacing="1" fill="#f0efec" id="title-line-1">SALT LAKE CITY</text><g id="title-line-2"><text x="72.0" y="450" font-family="Inter" font-weight="500" font-size="73.60000000000001" fill="#f0efec">→</text><text x="141.9" y="450" font-family="Barlow Condensed" font-stretch="condensed" font-weight="700" font-size="92" letter-spacing="1" fill="#f0efec"  xml:space="preserve"> SACRAMENTO</text></g><text x="72" y="1462" font-family="Barlow Condensed" font-stretch="condensed" font-weight="700" font-size="280" letter-spacing="0" fill="#f0efec" id="stat-number">649</text><text x="452.94378662109375" y="1462" font-family="Barlow Condensed" font-stretch="condensed" font-weight="700" font-size="80" letter-spacing="3" fill="#ffb547" id="stat-unit">MILES</text><g id="road-sign" transform="translate(72,1500)">
    <path d="M6 6 Q36 0 66 6 Q72 36 36 72 Q0 36 6 6Z" fill="#1f4aa8" stroke="#f0efec" stroke-width="3"/>
    <path d="M6 6 Q36 0 66 6 L69 18.72 L3 18.72Z" fill="#c8202f"/>
    <text x="36" y="51.839999999999996" text-anchor="middle" font-family="Barlow Condensed" font-stretch="condensed" font-weight="700" font-size="34" fill="#ffffff">80</text></g><g id="stat-chip-1"><rect x="160" y="1500" width="181.4" height="72" rx="36" fill="#1d2029" stroke="#30353f" stroke-width="2"/><text x="188.0" y="1547.52" font-family="Inter" font-weight="500" font-size="32" letter-spacing="0" fill="#f0efec" >10h 52m</text></g><g id="stat-chip-2"><rect x="357.359375" y="1500" width="174.4" height="72" rx="36" fill="#1d2029" stroke="#30353f" stroke-width="2"/><text x="385.4" y="1547.52" font-family="Inter" font-weight="500" font-size="32" letter-spacing="0" fill="#f0efec" >3 states</text></g><g id="stat-chip-3"><rect x="547.75" y="1500" width="232.3" height="72" rx="36" fill="#1d2029" stroke="#30353f" stroke-width="2"/><text x="575.8" y="1547.52" font-family="Inter" font-weight="500" font-size="32" letter-spacing="0" fill="#f0efec" >7,139 ft high</text></g></g><g id="guides" fill="none" stroke-width="2" stroke-dasharray="8 8" opacity="0.85"><rect x="72" y="220" width="936" height="1380" stroke="#ff4d8d"/><rect x="72" y="640" width="936" height="510" stroke="#4fd1ff"/></g></svg>
